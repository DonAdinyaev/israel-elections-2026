<style>
/* Layout: fits one viewport. Phones: one column, hemicycle on top, baskets side by side, tray below. Wide screens: hemicycle left, baskets right. */
:root{
  --bg:#ECEFF3; --panel:#FFFFFF; --ink:#12161C; --muted:#566070; --line:#D0D6DE;
  --a:#1B4DDB; --a-soft:#DCE5FF;
  --b:#D9560B; --b-soft:#FFE4D2;
  --pool:#8F99A8; --pool-soft:#E4E8EE;
  --focus:#1B4DDB;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --panel:#171C24; --ink:#E9EDF3; --muted:#9BA6B5; --line:#2B3440;
    --a:#7F9CFF; --a-soft:#1C2858; --b:#FF9550; --b-soft:#4B2A13;
    --pool:#6F7A8A; --pool-soft:#202833; --focus:#9DB3FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --panel:#171C24; --ink:#E9EDF3; --muted:#9BA6B5; --line:#2B3440;
  --a:#7F9CFF; --a-soft:#1C2858; --b:#FF9550; --b-soft:#4B2A13;
  --pool:#6F7A8A; --pool-soft:#202833; --focus:#9DB3FF;
  color-scheme:dark;
}

*{box-sizing:border-box}
/* Fit mode: the page is exactly one viewport tall. The hemicycle absorbs spare height; lists scroll internally only as a last resort. */
:root{padding:0!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:var(--bg); color:var(--ink);
  font:400 15px/1.4 var(--body);
  height:100vh;height:100dvh;
  padding-top:max(10px,env(safe-area-inset-top,0px));
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
h1,h2,p{margin:0}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.eyebrow{font:500 .7rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(1.05rem,4.6vw,2rem)/1.1 var(--display);min-width:0}
.lede{color:var(--muted);max-width:60ch;text-wrap:pretty;flex-basis:100%;display:none;margin-top:4px}

/* Poll tabs scroll sideways; the edge fades show which side has more (classes set in JS) */
.tabs{display:flex;gap:6px;flex:none;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:4px}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.tab{flex:none}
.tabs.fade-e{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
.tabs.fade-s{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px);mask-image:linear-gradient(to right,transparent,#000 36px)}
.tabs.fade-s.fade-e{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
[dir="rtl"] .tabs.fade-e{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 36px),transparent)}
[dir="rtl"] .tabs.fade-s{-webkit-mask-image:linear-gradient(to left,transparent,#000 36px);mask-image:linear-gradient(to left,transparent,#000 36px)}
[dir="rtl"] .tabs.fade-s.fade-e{-webkit-mask-image:linear-gradient(to left,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to left,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.tab{
  font:500 .84rem/1 var(--body);padding:8px 12px;border-radius:999px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;flex:none}
.meta strong{color:var(--ink);font-weight:600}
.link{font:inherit;color:var(--focus);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.stage{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px;
  display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-height:0;
}
.stage svg{display:block;width:100%;flex:1 1 0;min-height:0}
.seat{fill:#888;transition:fill .35s,fill-opacity .35s}
.s-a{fill:var(--a)} .s-b{fill:var(--b)} .s-p{fill:var(--pool)}
.seat.alt{fill-opacity:.58}
.big{font:700 34px var(--display);fill:var(--ink);text-anchor:middle}
.sm{font:400 11px var(--body);fill:var(--muted);text-anchor:middle}
.legend{display:none;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.verdict{
  border-radius:10px;padding:6px 10px;font:500 .82rem/1.3 var(--body);text-wrap:pretty;text-align:center;
  background:var(--pool-soft);flex:none;min-height:calc(2.6em + 12px);display:flex;align-items:center;justify-content:center;
}
.verdict.win-a{background:var(--a-soft)}
.verdict.win-b{background:var(--b-soft)}

/* The hemicycle and the board keep a fixed size; inside the board the pool takes what its chips need and the baskets get the rest */
.board{display:flex;flex-direction:column;gap:8px;flex:0 0 54%;min-height:0}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 0;min-height:96px}
.zone{
  min-width:0;min-height:0;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:8px;
  display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s;
}
.zhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.zone h2{font:600 .82rem/1.2 var(--body)}
.count{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.count b{font:700 1.3rem/1 var(--display);font-variant-numeric:tabular-nums}
.count span{font:500 .75rem var(--mono);color:var(--muted)}
.zone-a .count b{color:var(--a)}
.zone-b .count b{color:var(--b)}
.bar{height:5px;border-radius:99px;background:var(--pool-soft);overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s}
.zone-a .bar i{background:var(--a)} .zone-b .bar i{background:var(--b)}
.zone.won{border-color:var(--ink)}
.zone-a.won{border-color:var(--a)} .zone-b.won{border-color:var(--b)}
.zone-a.over{border-color:var(--a);background:var(--a-soft)}
.zone-b.over{border-color:var(--b);background:var(--b-soft)}
.zone-p.over{border-color:var(--pool);background:var(--pool-soft)}
.list{display:flex;flex-direction:column;gap:4px;min-height:60px;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.list:empty::before{content:attr(data-empty);color:var(--muted);font-size:.78rem;padding:6px 2px}
.zone-p{border-style:dashed;flex:0 1 auto}
.zone-p .phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;align-items:center}
.zone-p .list{flex-direction:row;flex-wrap:wrap;align-content:flex-start;min-height:36px;flex:0 1 auto}

.chip{
  display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;flex:none;
  text-align:start;padding:6px 8px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:500 .78rem/1.15 var(--body);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.chip .t{min-width:0;flex:1 1 auto}
.faces{display:flex;flex:none}
.faces img{width:22px;height:22px;border-radius:50%;object-fit:cover;display:block;background:var(--pool-soft);border:1.5px solid var(--panel);pointer-events:none}
.faces img+img{margin-inline-start:-9px}
.chip small{display:none;font-size:.7rem;font-weight:400;opacity:.72;margin-top:1px}
.chip .n{font:600 .9rem/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .n em{font-style:normal;font-weight:500;font-size:.7rem;opacity:.6;margin-right:1px}
.chip.in-a{background:var(--a-soft);border-color:var(--a)}
.chip.in-b{background:var(--b-soft);border-color:var(--b)}
.chip.in-p{background:var(--pool-soft);border-color:var(--pool)}
.zone-p .chip{width:auto;flex:1 1 120px}
.chip.zero{opacity:.55;border-style:dashed}
.chip.lifted{opacity:.3}
.chip.ghost{
  position:fixed;z-index:50;pointer-events:none;opacity:.96;margin:0;
  box-shadow:0 10px 28px rgba(0,0,0,.28);transform:scale(1.04) rotate(-1.5deg);
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.controls{display:flex;gap:6px}
.ghostbtn{
  font:500 .76rem/1 var(--body);padding:7px 10px;border-radius:9px;white-space:nowrap;
  border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;
}

/* Info dialog: fixed header, the body scrolls on its own so nothing gets cut off on short phones */
dialog.info{
  width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);
  border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);
  padding:0;font-size:.86rem;overflow:hidden;
}
dialog.info[open]{display:flex;flex-direction:column}
dialog.info::backdrop{background:rgba(0,0,0,.5)}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);flex:none}
[dir="rtl"] .info-head{padding:12px 18px 10px 14px}
.info-head h2{font:600 1.02rem/1.2 var(--body);margin:0}
.info-body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 18px 18px;min-height:0}
dialog.info h3{font:600 .92rem/1.2 var(--body);margin:14px 0 6px}
dialog.info h3:first-child{margin-top:0}
dialog.info p{margin:0 0 8px;color:var(--muted)}
dialog.info ul{margin:0 0 8px;padding-inline-start:18px;color:var(--muted)}
dialog.info li{margin:3px 0}
dialog.info a{color:inherit;text-underline-offset:2px}
dialog.info details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
dialog.info summary{cursor:pointer;font-weight:600;color:var(--ink)}
dialog.info .credits{font-size:.78rem;margin-top:8px}

.lang{display:flex;gap:2px;margin-inline-start:auto;align-self:center;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.lang button{font:600 .66rem/1 var(--body);letter-spacing:.04em;padding:5px 7px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.eyebrow{flex-basis:100%}
/* Hebrew: the Latin/Cyrillic display faces have no Hebrew glyphs */
:root[lang="he"]{--display:'Heebo',system-ui,sans-serif;--body:'Heebo',system-ui,sans-serif}
:root[lang="he"] h1{font-weight:800;letter-spacing:0}
:root[lang="he"] .eyebrow{letter-spacing:0}

/* Narrow phones: squeeze basket chrome so the hemicycle keeps its height */
@media (max-width:599px){
  .tab{font-size:.78rem;padding:7px 10px}
  .zone h2{font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .count span{display:none}
  .chip{font-size:.74rem;padding:4px 6px;gap:5px}
  .faces img{width:20px;height:20px}
  .faces img+img{margin-inline-start:-8px}
  .zone-p .chip{flex-basis:96px}
  .zone-p h2{font-size:.76rem}
  .zone-p .phead{flex-wrap:nowrap}
  .unit{display:none}
  .ghostbtn{padding:6px 8px;font-size:.72rem}
  .ghostbtn .long{display:none}
}
@media (min-width:600px){ .ghostbtn .short{display:none} }
/* Roomier phones and tablets: show party leaders */
@media (min-width:600px) and (min-height:760px){
  .chip{padding:8px 10px;font-size:.84rem}
  .chip small{display:block}
  .faces img{width:30px;height:30px}
  .faces img+img{margin-inline-start:-12px}
  .lede{display:block}
  .count b{font-size:1.6rem}
}
/* Wide screens: hemicycle on the left, baskets on the right */
@media (min-width:900px) and (min-height:520px){
  .wrap{
    max-width:1180px;display:grid;gap:10px 20px;
    grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
    grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"h b" "t b" "m b" "s b";
  }
  header{grid-area:h} .tabs{grid-area:t} .meta{grid-area:m} .stage{grid-area:s;min-height:0}
  .tabs,.tabs.fade-s,.tabs.fade-e{flex-wrap:wrap;overflow:visible;padding-bottom:0;-webkit-mask-image:none;mask-image:none}
  .board{grid-area:b;gap:10px}
  .lede{display:block}
  .legend{display:flex}
  .verdict{font-size:.92rem;padding:10px 12px;min-height:calc(2.6em + 20px)}
  .zone{padding:12px;gap:8px}
  .zone h2{font-size:.9rem}
  .count b{font-size:1.8rem}
  .bar{height:7px}
  .list{gap:6px}
  .chip{padding:8px 10px;font-size:.86rem}
  .chip small{display:block}
  .faces img{width:32px;height:32px}
  .faces img+img{margin-inline-start:-12px}
  .chip .n{font-size:1rem}
  .zone-p .chip{flex-basis:160px}
}
/* Short landscape phones: let the page scroll rather than crush everything */
@media (max-height:519px) and (max-width:899px){
  body{overflow:auto;height:auto}
  .wrap{height:auto}
  .stage{flex:none;height:220px}
  .board{flex:none}
  .zone-p{height:auto}
  .list{overflow:visible}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

/* ---------- hemicycle ---------- */
var NS = 'http://www.w3.org/2000/svg';
var ROWS = [[90,13],[110,16],[130,19],[150,21],[170,24],[190,27]];
var seatPos = [];
ROWS.forEach(function(row, ri){
  var r = row[0], n = row[1];
  for(var j = 0; j < n; j++){
    var th = Math.PI * (1 - (j + 0.5) / n);
    seatPos.push({x:200 + r * Math.cos(th), y:200 - r * Math.sin(th), th:th, ri:ri});
  }
});
seatPos.sort(function(p, q){ return (q.th - p.th) || (p.ri - q.ri); });
var hemi = $('hemi');
var circles = seatPos.map(function(s){
  var c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', s.x.toFixed(1));
  c.setAttribute('cy', s.y.toFixed(1));
  c.setAttribute('r', '7.4');
  c.setAttribute('class', 'seat s-p');
  c.appendChild(document.createElementNS(NS, 'title'));
  hemi.appendChild(c);
  return c;
});

function paintSeats(S){
  var seq = [];
  /* seats run left to right; in RTL the baskets swap sides, so the hemicycle does too */
  (lang === 'he' ? ['a','p','b'] : ['b','p','a']).forEach(function(z){
    var k = 0;
    CANON.filter(function(id){ return assign[id] === z; }).forEach(function(id){
      var n = S.seats[id];
      for(var i = 0; i < n; i++) seq.push({z:z, alt:(k % 2 === 1), name:L(BYID[id].name)});
      if(n > 0) k++;
    });
  });
  circles.forEach(function(c, i){
    var s = seq[i] || {z:'p', alt:true, name:''};
    c.setAttribute('class', 'seat s-' + s.z + (s.alt ? ' alt' : ''));
    c.firstChild.textContent = s.name;
  });
}

/* ---------- render ---------- */
function chipHTML(id, z, n, S){
  var p = BYID[id], name = esc(L(p.name));
  var title = n === 0 ? ' title="' + esc(t('zero')) + '"' : '';
  return '<button type="button" class="chip in-' + z + (n === 0 ? ' zero' : '') + '" data-id="' + id + '"' + title +
    ' aria-label="' + name + ', ' + n + ' ' + t('seats')(n) + ', ' + t('now') + ': ' + esc(t(ZK[z])) + '">' +
    '<span class="faces">' + p.img.map(function(f){ return '<img src="img/' + f + '.jpg" alt="" draggable="false" width="48" height="48">'; }).join('') + '</span>' +
    '<span class="t">' + name + '<small>' + esc(partySub(p)) + '</small></span>' +
    '<span class="n">' + n + '</span></button>';
}

function render(){
  var S = SOURCES[src];
  tot = {a:0,b:0,p:0};
  var buckets = {a:[], b:[], p:[]};
  CANON.forEach(function(id){
    var z = assign[id], n = S.seats[id];
    tot[z] += n;
    buckets[z].push(id);
  });
  ['a','b','p'].forEach(function(z){
    buckets[z].sort(function(x, y){ return S.seats[y] - S.seats[x]; });
    $('list-' + z).innerHTML = buckets[z].map(function(id){ return chipHTML(id, z, S.seats[id], S); }).join('');
  });

  ['a','b'].forEach(function(z){
    var n = tot[z];
    $('cnt-' + z).textContent = n;
    $('bar-' + z).style.width = Math.min(100, n / 61 * 100) + '%';
    document.querySelector('.zone-' + z).classList.toggle('won', n >= 61);
  });
  $('pool-sum').innerHTML = tot.p + '<span class="unit"> ' + t('seats')(tot.p) + '</span>';

  var v = $('verdict');
  v.className = 'verdict';
  if(tot.a >= 61){
    v.classList.add('win-a');
    v.textContent = t('winA')(tot.a);
  } else if(tot.b >= 61){
    v.classList.add('win-b');
    v.textContent = t('winB')(tot.b);
  } else {
    v.textContent = t('none')(61 - tot.a, 61 - tot.b) + (tot.p > 0 ? t('left')(tot.p) : '');
  }

  paintSeats(S);

  if(lastFocus){
    var el = $('board').querySelector('[data-id="' + lastFocus + '"]');
    if(el) el.focus();
    lastFocus = null;
  }
}

function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function renderSource(){
  var S = SOURCES[src];
  Array.prototype.forEach.call($('tabs').children, function(b){
    b.setAttribute('aria-pressed', b.dataset.src === src ? 'true' : 'false');
  });
  $('meta').innerHTML = '<strong></strong> · ' + S.date + ' · ';
  $('meta').firstChild.textContent = L(S.label);
  $('meta').appendChild(document.createTextNode(L(S.by) + (S.n ? ', ' + t('asked')(S.n) : '')));
  render();
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function applyLang(){
  var root = document.documentElement;
  root.lang = lang;
  root.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.title = t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){ el.textContent = t(el.dataset.i18n); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function(el){ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function(el){ el.title = t(el.dataset.i18nTitle); });
  Array.prototype.forEach.call(document.querySelectorAll('.list'), function(el){ el.dataset.empty = t('empty'); });
  Array.prototype.forEach.call($('lang').children, function(b){ b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
  Array.prototype.forEach.call($('tabs').children, function(b){ b.textContent = L(SOURCES[b.dataset.src].label); });
  /* <bdi> keeps Latin author names and licenses from scrambling inside Hebrew text */
  $('credits').innerHTML = CREDITS.map(function(c){
    return '<li><a href="https://commons.wikimedia.org/wiki/File:' + c[1] + '" target="_blank" rel="noopener">' + esc(L(LEADERS[c[0]])) + '</a>: <bdi>' +
      esc(c[2]) + '</bdi>, <bdi>' + (c[3] === 'PD' ? esc(t('pd')) : c[3]) + '</bdi></li>';
  }).join('');
  renderSource();
  $('tabs').scrollLeft = 0;
  tabsFade();
}

/* ---------- moves ---------- */
function move(id, z){
  if(assign[id] === z) { render(); return; }
  assign[id] = z;
  render();
}
/* Tap: a basket sends the party to the pool; the pool sends it back to the basket it last left
   (or its poll bloc; parties that start in the pool go to Eisenkot's basket first). */
var lastBasket = {};
function cycle(id){
  var z = assign[id];
  if(z !== 'p'){ lastBasket[id] = z; move(id, 'p'); return; }
  move(id, lastBasket[id] || (BYID[id].def === 'p' ? 'b' : BYID[id].def));
}

/* ---------- source tabs ---------- */
ORDER.forEach(function(k){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab';
  b.dataset.src = k;
  b.addEventListener('click', function(){
    src = k; renderSource();
    if(b.scrollIntoView) b.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  });
  $('tabs').appendChild(b);
});
/* scrollLeft is negative in RTL, hence Math.abs */
function tabsFade(){
  var el = $('tabs'), max = el.scrollWidth - el.clientWidth, x = Math.abs(el.scrollLeft);
  el.classList.toggle('fade-s', max > 1 && x > 2);
  el.classList.toggle('fade-e', max > 1 && x < max - 2);
}
$('tabs').addEventListener('scroll', tabsFade, {passive:true});
window.addEventListener('resize', tabsFade);
/* mouse wheel scrolls the tab row sideways */
$('tabs').addEventListener('wheel', function(e){
  var el = this;
  if(el.scrollWidth <= el.clientWidth || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  el.scrollLeft += (lang === 'he' ? -1 : 1) * e.deltaY;
  e.preventDefault();
}, {passive:false});
Array.prototype.forEach.call($('lang').children, function(b){
  b.addEventListener('click', function(){
    lang = b.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch(_) {}
    if(/[?&]lang=/.test(location.search)){
      try { history.replaceState(null, '', location.search.replace(/([?&]lang=)(ru|en|he)/, '$1' + lang)); } catch(_) {}
    }
    applyLang();
  });
});
$('reset').addEventListener('click', function(){ resetAssign(); render(); });
$('info-btn').addEventListener('click', function(){ $('info').showModal(); });
$('info-close').addEventListener('click', function(){ $('info').close(); });
$('info').addEventListener('click', function(e){ if(e.target === this) this.close(); });
$('clear').addEventListener('click', function(){ PARTIES.forEach(function(p){ assign[p.id] = 'p'; }); render(); });

/* ---------- drag and drop (pointer events: mouse, touch, pen) ---------- */
var board = $('board');
var drag = null;

function zoneAt(x, y){
  var el = document.elementFromPoint(x, y);
  return el ? el.closest('[data-zone]') : null;
}
function highlight(z){
  Array.prototype.forEach.call(board.querySelectorAll('[data-zone]'), function(el){
    el.classList.toggle('over', el.dataset.zone === z);
  });
}

board.addEventListener('pointerdown', function(e){
  var chip = e.target.closest('.chip');
  if(!chip) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  drag = {chip:chip, id:chip.dataset.id, sx:e.clientX, sy:e.clientY, pid:e.pointerId, active:false, ghost:null, ox:0, oy:0};
  try { chip.setPointerCapture(e.pointerId); } catch(_) {}
});

board.addEventListener('pointermove', function(e){
  if(!drag || e.pointerId !== drag.pid) return;
  if(!drag.active){
    if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
    var r = drag.chip.getBoundingClientRect();
    drag.ox = drag.sx - r.left;
    drag.oy = drag.sy - r.top;
    var g = drag.chip.cloneNode(true);
    g.classList.add('ghost');
    g.style.width = r.width + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.chip.classList.add('lifted');
    drag.active = true;
  }
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px';
  drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  var z = zoneAt(e.clientX, e.clientY);
  highlight(z ? z.dataset.zone : null);
});

function endDrag(e, cancelled){
  if(!drag || e.pointerId !== drag.pid) return;
  var d = drag;
  drag = null;
  highlight(null);
  if(d.ghost) d.ghost.remove();
  d.chip.classList.remove('lifted');
  if(cancelled) return;
  if(d.active){
    var z = zoneAt(e.clientX, e.clientY);
    if(z) move(d.id, z.dataset.zone);
  } else {
    cycle(d.id);
  }
}
board.addEventListener('pointerup', function(e){ endDrag(e, false); });
board.addEventListener('pointercancel', function(e){ endDrag(e, true); });

/* keyboard: Enter/Space cycles, arrows send to a basket */
board.addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if(chip && e.detail === 0){ lastFocus = chip.dataset.id; cycle(chip.dataset.id); }
});
board.addEventListener('keydown', function(e){
  var chip = e.target.closest('.chip');
  if(!chip) return;
  var rtl = lang === 'he';
  var m = {ArrowLeft:rtl ? 'a' : 'b', ArrowRight:rtl ? 'b' : 'a', ArrowDown:'p'}[e.key];
  if(m){ e.preventDefault(); lastFocus = chip.dataset.id; move(chip.dataset.id, m); }
});

applyLang();
})();
</script>
